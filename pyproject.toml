[project]
name = "tabts-skillbench"
version = "0.1.0"
description = "A skill-aware benchmark for multi-table temporal data-analysis agents"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.11"
keywords = ["benchmark", "agents", "skills", "temporal-data"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
license-files = [
    "LICENSE",
    "NOTICE",
    "THIRD_PARTY_NOTICES.md",
]
dependencies = [
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
benchmark = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "scipy>=1.11,<2",
    "pyarrow>=15,<24",
    "duckdb>=1.0,<2",
    "statsmodels>=0.14,<1",
    "openpyxl>=3.1,<4",
]
runner = [
    "typer>=0.20.0,<1.0.0",
    "anthropic>=0.45.0,<1.0.0",
    "pydantic>=2.12.0,<3.0.0",
    "pydantic-settings>=2.12.0,<3.0.0",
    "websockets>=16.0,<17.0",
    "websocket-client>=1.9.0,<2.0.0",
    "httpx>=0.28.0,<1.0.0",
    "ddgs>=9.5.5,<10.0.0",
    "oauth-cli-kit>=0.1.3,<1.0.0",
    "loguru>=0.7.3,<1.0.0",
    "readability-lxml>=0.8.4,<1.0.0",
    "rich>=14.0.0,<15.0.0",
    "croniter>=6.0.0,<7.0.0",
    "python-telegram-bot[socks]>=22.6,<23.0",
    "lark-oapi>=1.5.0,<2.0.0",
    "socksio>=1.0.0,<2.0.0",
    "python-socketio>=5.16.0,<6.0.0",
    "msgpack>=1.1.0,<2.0.0",
    "slack-sdk>=3.39.0,<4.0.0",
    "slackify-markdown>=0.2.0,<1.0.0",
    "python-socks[asyncio]>=2.8.0,<3.0.0; sys_platform != 'win32'",
    "prompt-toolkit>=3.0.50,<4.0.0",
    "questionary>=2.0.0,<3.0.0",
    "mcp>=1.26.0,<2.0.0",
    "json-repair>=0.57.0,<1.0.0",
    "chardet>=3.0.2,<6.0.0",
    "openai>=2.8.0",
    "tiktoken>=0.12.0,<1.0.0",
    "jinja2>=3.1.0,<4.0.0",
    "dulwich>=0.22.0,<1.0.0",
    "pypdf>=5.0.0,<6.0.0",
    "python-docx>=1.1.0,<2.0.0",
    "python-pptx>=1.0.0,<2.0.0",
    "filelock>=3.25.2",
    "boto3>=1.43.0",
]
dev = [
    "pytest>=9.0.0,<10.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "pytest-cov>=6.0.0,<7.0.0",
    "jsonschema>=4.23.0,<5.0.0",
    "ruff>=0.1.0",
    "build>=1.2.0,<2.0.0",
]

[project.scripts]
tabts-bench = "benchmark_eval.cli:main"
nanobot = "nanobot.cli.commands:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = [
    "benchmark_eval/**/*.py",
    "isolated_benchmark_runner/**/*.py",
    "nanobot/**/*.py",
    "nanobot/templates/**/*.md",
    "nanobot/skills/**/*.md",
    "nanobot/skills/**/*.sh",
    "benchmark/**/*",
    "skills/**/*",
    "configs/**/*",
    "docs/**/*",
]

[tool.hatch.build.targets.wheel]
packages = ["benchmark_eval", "isolated_benchmark_runner", "nanobot"]

[tool.hatch.build.targets.wheel.force-include]
"tools/standardize_skillmtts_datasets.py" = "benchmark_eval/_standardize_skillmtts_datasets.py"
"benchmark" = "benchmark"
"skills" = "skills"
"configs" = "configs"
"docs" = "docs"
"data_sources.yaml" = "data_sources.yaml"
"data/README.md" = "data/README.md"
"BENCHMARK_CARD.md" = "BENCHMARK_CARD.md"
"CHANGELOG.md" = "CHANGELOG.md"
"CODE_OF_CONDUCT.md" = "CODE_OF_CONDUCT.md"
"CONTRIBUTING.md" = "CONTRIBUTING.md"
"DATA_LICENSES.md" = "DATA_LICENSES.md"
"EVALUATION_PROTOCOL.md" = "EVALUATION_PROTOCOL.md"
"SECURITY.md" = "SECURITY.md"

[tool.hatch.build.targets.sdist]
include = [
    "benchmark_eval/",
    "isolated_benchmark_runner/",
    "nanobot/",
    "benchmark/",
    "skills/",
    "configs/",
    "docs/",
    "artifacts/",
    "scripts/",
    "tests/",
    "tools/",
    "README.md",
    "README_zh-CN.md",
    "BENCHMARK_CARD.md",
    "CHANGELOG.md",
    "CODE_OF_CONDUCT.md",
    "CONTRIBUTING.md",
    "LICENSE",
    "NOTICE",
    "DATA_LICENSES.md",
    "EVALUATION_PROTOCOL.md",
    "SECURITY.md",
    "THIRD_PARTY_NOTICES.md",
    "CITATION.cff",
    "data_sources.yaml",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["benchmark_eval", "isolated_benchmark_runner"]
omit = ["tests/*", "**/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
